services:
  - type: web
    name: instacop
    runtime: python
    plan: free
    buildCommand: pip install -r api/requirements.txt -r engine/requirements.txt -r bot/requirements.txt -r workers/requirements.txt
    startCommand: python serve.py
    healthCheckPath: /health
    envVars:
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: IG_PROVIDER
        value: hikerapi
      - key: HIKERAPI_TOKEN
        sync: false
      - key: IG_SESSION_ID
        sync: false
      - key: IG_CSRF_TOKEN
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: IG_DM_ACCESS_TOKEN
        sync: false
      - key: IG_DM_VERIFY_TOKEN
        sync: false
      - key: IG_DM_APP_SECRET
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      - key: FOLLOWUP_DELAY_MINUTES
        value: "17280"
      - key: CORS_ORIGINS
        value: "*"
      - key: MAX_COLD_CHECKS_PER_DAY
        value: "200"
      - key: BOT_ALLOWLIST
        value: ""
